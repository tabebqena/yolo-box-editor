# yolo-box-editor actions: one YAML file per action in an actions/ dir.
#
# This file is a shipped, comments-only example and defines nothing. Your own
# actions live in <home>/actions/ (next to the app/ folder, or wherever --home
# points) and are read after the shipped ones, so a file with the same name wins
# and is never overwritten by an upgrade. Copy this file to a new <Name>.yaml to
# add an action, or write your own with a `name:` key. A file with no `steps` and
# no `after_success` is ignored.
#
# Format (2-space indentation, lines starting with # are ignored):
#
#   api_version: 5              # extension format version (older files are
#                               # opened in the YAML editor in the web UI)
#   name: Remove                # optional; defaults to the file name
#   steps:                      # run in order; execution stops at the first
#     - rm -f {IMAGE_PATH}      # failure. Entries share the syntax below.
#     - rm -f {LABEL_PATH}
#   after_success:              # optional, runs after all steps succeeded
#     - app_refresh_images_list
#
# `steps` and `after_success` accept the same entries:
#   - an app_* name (run in the UI), or
#   - a backend_* name (run inline on the server; e.g. backend_rescan_images), or
#   - action_<Name> (run that action inline), or
#   - anything else = a shell command.
# The backend runs the whole queue, pausing at each app_* entry for the UI.
# `steps` and `after_success` may also be a single value on the key line.
#
# Event hooks do NOT live here: they are YAML files in the sibling hooks/ folder
# (see hooks/example.yaml). Hooks cannot be named in `after_success` (they are
# event-driven only).
#
# Placeholders (do NOT quote them; the app shell-quotes each value for you):
#   {IMAGE_PATH}     path of the current image
#   {LABEL_PATH}     path of the current image's label file (may not exist yet)
#   {DATASET_PATH}   root path of the loaded dataset
#   {DATA_YAML_PATH} path of the loaded data.yaml
#   {IMAGE_INDEX}    1-based position of the current image in the list
#   {APP_DIR}        the folder holding app.py (the shipped code)
#   {HOME_DIR}       your user folder (the working directory of every run)
#   {APP_SCRIPT_DIR} the shipped helper scripts (`app/scripts/`)
#   {USER_SCRIPT_DIR} your helper scripts (`<home>/scripts/`)
#   {PYTHON}         the Python interpreter running the app (use it instead of
#                    `python`, which may not be on PATH)
#   {PIPE_PATH}      a per-run scratch file shared by every step and by the
#                    actions in `after_success`, so they can pass data on; it is
#                    deleted when the run ends (use --keep-pipe to keep it)
#
# Reach a script explicitly with `{USER_SCRIPT_DIR}/x.py` (yours) or
# `{APP_SCRIPT_DIR}/x.py` (shipped). Steps run with the working directory set to
# {HOME_DIR} (logged to the server console), so `scripts/x.py` also works
# relatively. The same paths are exported as $YBE_USER_SCRIPT_DIR and
# $YBE_APP_SCRIPT_DIR.
#
# App actions usable in after_success (see README for the full list):
#   app_refresh_images_list   re-scan the image folders (stay on same image)
#   app_reload_images_list    re-read the server list (no disk scan)
#   app_refresh_image         re-fetch the current image (cache-busted)
#
# Backend actions usable in steps / after_success:
#   backend_rescan_images     re-scan the image folders server-side
#
# Your actions: files in <home>/actions/ are read after the shipped ones, win on
# a name clash, and are never shipped/overwritten.

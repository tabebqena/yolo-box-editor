<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOLO Box Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">YOLO Box Editor</div>

    <div class="topbar-end">
      <button id="notifBtn" class="icon-btn" title="Notifications" aria-label="Notifications"
              aria-haspopup="true" aria-expanded="false">
        <span aria-hidden="true">&#128276;</span>
        <span id="notifBadge" class="notif-badge hidden">0</span>
      </button>
      <button id="settingsBtn" title="Settings: view options, dataset, shortcuts">&#9881; Settings</button>
      <button id="sidePanelToggle" class="hidden" title="Show / hide the boxes panel">Boxes</button>

      <div id="notifPanel" class="notif-panel hidden">
        <div class="notif-panel-head">
          <span>Notifications</span>
          <button id="notifClear" class="notif-clear" title="Clear all notifications">Clear</button>
        </div>
        <div id="notifList" class="notif-list"></div>
      </div>
    </div>
  </header>

  <div class="middle">
    <main class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </main>

    <aside id="sidePanel" class="side-panel">
      <div id="sidePanelResizer" class="side-panel-resizer" title="Drag to resize the panel"></div>
      <div class="side-panel-head">
        <span class="side-panel-title">Boxes</span>
        <span id="sidePanelCount" class="side-panel-count">0</span>
        <button id="sidePanelClose" class="side-panel-close" title="Hide panel">&#10005;</button>
      </div>

      <div class="side-panel-controls">
        <div class="splitbox">
          <label for="splitSelect">Split</label>
          <select id="splitSelect" title="Work on one split, or all splits together"></select>
        </div>

        <div id="filterBox" class="filterbox hidden">
          <label for="filtersBtn">Filters</label>
          <button id="filtersBtn" class="filter-btn" title="Chain filters from filters/ to narrow the image list">No filter</button>
        </div>

        <div class="actionbox">
          <span class="action-label" title="Run a user action from actions.yaml on the current image">Actions</span>
          <div id="actionBtns" class="action-btns"></div>
        </div>
      </div>

      <div id="boxList" class="box-list"></div>
    </aside>
  </div>

  <section id="tagBar" class="tagbar hidden">
    <span class="tagbar-title">Tags</span>
    <span id="tagHint" class="tagbar-hint hidden">Alt+1..9 toggles</span>
    <div id="tagBadges" class="tag-badges"></div>
    <div class="tagbar-add">
      <input id="tagInput" class="tag-input" type="text" placeholder="add a tag…"
             list="tagSuggestions" maxlength="64">
      <datalist id="tagSuggestions"></datalist>
      <button id="addTagBtn" type="button" title="Add tag to the image (new names are written to tags.yaml)">+ Add tag</button>
    </div>
  </section>

  <section class="imagebar">
    <span id="filename" class="filename"></span>
    <div class="imagebar-nav">
      <button id="prevBtn" title="Previous (←)">&#9664; Prev</button>
      <input id="counter" class="counter" type="text" inputmode="numeric"
             title="Current image — type a number and press Enter to jump" value="0 / 0">
      <button id="nextBtn" title="Next (→)">Next &#9654;</button>
    </div>
    <div class="imagebar-right">
      <span id="boxCount" class="boxcount"></span>
      <button id="undoBtn" title="Undo (Z)">Undo</button>
      <button id="redoBtn" title="Redo (Y)">Redo</button>
      <button id="saveBtn" class="primary" title="Save (S)">Save</button>
    </div>
  </section>

  <div id="classPicker" class="class-picker hidden"></div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-box settings-modal">
      <div class="modal-head">
        <span class="modal-title">Settings</span>
        <button id="settingsModalClose" class="modal-close" title="Close (Esc)">&#10005;</button>
      </div>
      <div class="settings-modal-body">
        <section class="settings-group">
          <h3 class="settings-group-title">View</h3>
          <label class="settings-row" for="readonlySw" title="Disable drawing and saving">
            <input type="checkbox" id="readonlySw">
            <span>Read-only</span>
          </label>
          <label class="settings-row" for="taggingSw" title="Show and edit image tags below the image">
            <input type="checkbox" id="taggingSw">
            <span>Tags</span>
          </label>
          <label class="settings-row" for="autoSaveSw" title="Save labels automatically after each edit (no save/discard prompt when navigating)">
            <input type="checkbox" id="autoSaveSw">
            <span>Auto-save</span>
          </label>
        </section>

        <section class="settings-group">
          <h3 class="settings-group-title">Dataset</h3>
          <label class="field" id="yamlField">
            <span>data.yaml</span>
            <select id="recentSelect" title="Open a recently used data.yaml">
              <option value="">Recent…</option>
            </select>
            <input id="dataYaml" type="text" placeholder="/path/to/data.yaml">
          </label>
          <div class="settings-actions">
            <button id="setDataBtn">Load data.yaml</button>
            <span id="datasetPath" class="hint"></span>
          </div>
        </section>

        <section class="settings-group">
          <h3 class="settings-group-title">Shortcuts</h3>
          <button id="shortcutsModalBtn" title="Show all keyboard and mouse shortcuts">Show all shortcuts</button>
        </section>
      </div>
    </div>
  </div>

  <div id="shortcutsModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span class="modal-title">Shortcuts</span>
        <button id="shortcutsModalClose" class="modal-close" title="Close (Esc)">&#10005;</button>
      </div>
      <div id="shortcutItems" class="shortcut-modal-body"></div>
    </div>
  </div>

  <div id="actionResult" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span id="actionResultTitle" class="modal-title"></span>
        <button id="actionResultClose" class="modal-close" title="Close (Esc)">&#10005;</button>
      </div>
      <div id="actionResultCmd" class="modal-cmd"></div>
      <pre id="actionResultExit" class="modal-exit"></pre>
      <pre id="actionResultOut" class="modal-out"></pre>
      <pre id="actionResultErr" class="modal-err"></pre>
    </div>
  </div>

  <div id="filterModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span class="modal-title">Filter chain</span>
        <button id="filterModalClose" class="modal-close" title="Close (Esc)">&#10005;</button>
      </div>
      <div id="filterModalBody" class="filter-modal-body"></div>
      <div class="modal-actions">
        <button id="filterModalClear" title="Remove every filter">Clear</button>
        <button id="filterModalApply" class="primary" title="Run the selected filters top to bottom">Apply</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

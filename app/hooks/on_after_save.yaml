# Shipped hook: after a successful label save, run the built-in update_tags
# action (write the image's tag file; add any new tag names to tags.yaml).
#
# Turn it off (or replace it with your own after_save hook) by creating your own
# <home>/hooks/on_after_save.yaml with the same event and `active: false`, e.g.:
#
#   event_name: after_save
#   active: false
event_name: after_save
active: true
steps:
  - action_update_tags

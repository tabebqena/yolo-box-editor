# yolo-box-editor event hooks: one YAML file per hook in a hooks/ dir.
#
# This file is a shipped, comments-only example. Your own hooks live in
# <home>/hooks/ and are read after the shipped ones, so a file with the same
# event wins and is never overwritten by an upgrade.
#
# A hook runs when the app fires an event — it is not a toolbar button and
# cannot be bound to a key. The event is taken from the FILE NAME:
#
#     on_<event>.yaml
#
# so `on_after_save.yaml` runs after every successful label write. When the
# file name does not name a known event, the `event_name:` key is used as a
# fallback. If neither names a known event, the file is reported as an error.
#
# This example file is comments only and defines nothing: templates with no
# `steps` and no `after_success` are ignored silently, so it shows no error.
#
# Known events (the <event> part of the file name):
#
#   on_images_list_loaded   image list loaded / rescanned
#   on_image_loaded         an image opened in the editor
#   on_before_prev          before leaving to the previous image, before the
#                           unsaved-changes / auto-save handling
#   on_before_next          before leaving to the next image, before the
#                           unsaved-changes / auto-save handling
#   on_prev                 before navigating to the previous image
#   on_next                 before navigating to the next image
#   on_before_save          before labels are written (a failure aborts the save)
#   on_after_save           after a successful label write
#   on_box_created          a box was drawn
#   on_box_deleted          a box was removed
#   on_box_edited           a box was moved / resized / reclassed
#
# Format (2-space indentation, lines starting with # are ignored):
#
#   api_version: 1          # extension format version (older files are opened
#                           # in the YAML editor in the web UI)
#   steps:                  # run in order; execution stops at the first
#     - touch {DATASET_PATH}/saved.log   # failure. Entries share the syntax
#   after_success:          # optional, runs after all steps succeeded
#     - app_refresh_image
#
# `steps` and `after_success` accept the same entries:
#   - an app_* name (run in the UI), or
#   - a backend_* name (run inline on the server; e.g. backend_rescan_images), or
#   - action_<Name> (run that action inline), or
#   - anything else = a shell command.
# The backend runs the whole queue, pausing at each app_* entry for the UI.
#
# Optional keys:
#
#   event_name: after_save  # fallback when the file name names no known event
#   active: false           # ignore this hook without deleting it
#
# Placeholders (do NOT quote them; the app shell-quotes each value for you):
#   {IMAGE_PATH}     path of the current image
#   {LABEL_PATH}     path of the current image's label file (may not exist yet)
#   {DATASET_PATH}   root path of the loaded dataset
#   {DATA_YAML_PATH} path of the loaded data.yaml
#   {IMAGE_INDEX}    1-based position of the current image in the list
#   {APP_DIR}        the folder holding app.py (the shipped code)
#   {HOME_DIR}       your user folder (the working directory of every run; it is
#                    also logged to the server console)
#   {APP_SCRIPT_DIR} the shipped helper scripts (`app/scripts/`)
#   {USER_SCRIPT_DIR} your helper scripts (`<home>/scripts/`)
#   {PIPE_PATH}      a per-run scratch file shared by every step and by the
#                    actions in `after_success`, so they can pass data on; it is
#                    deleted when the run ends (use --keep-pipe to keep it)
#
# Reach a helper explicitly with `{USER_SCRIPT_DIR}/x.py` (yours) or
# `{APP_SCRIPT_DIR}/x.py` (shipped). Steps run with cwd = {HOME_DIR}, so
# `scripts/x.py` also works relatively. Both paths are exported as
# $YBE_USER_SCRIPT_DIR and $YBE_APP_SCRIPT_DIR.
#
# Example: <home>/hooks/on_after_save.yaml
#   steps:
#     - python {USER_SCRIPT_DIR}/helper.py {DATA_YAML_PATH} {IMAGE_PATH} {LABEL_PATH}
#
# Your hooks: files in <home>/hooks/ are read after the shipped ones, win on an
# event clash, and are never shipped/overwritten.

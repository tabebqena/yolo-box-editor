# Keep only the images that do NOT have the chosen tag.
#
# Same `{DATASET_TAG_NAMES}` dropdown as `has_tag.yaml`; the helper runs with
# `--invert`.
api_version: 3
name: Does not have tag
description: Keep only images that do not have the chosen tag.
arguments:
  - name: tag_name
    required: true
    options: {DATASET_TAG_NAMES}
steps:
  - {PYTHON} {APP_SCRIPT_DIR}/tag_filter.py {INPUT_PIPE} {OUTPUT_PIPE} --tag {TAG_NAME} --tags-dir {TAGS_DIR} --invert

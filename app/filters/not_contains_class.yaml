# Keep only the images whose label does NOT contain the chosen class.
#
# Same `{DATASET_CLASS_NAMES}` dropdown as `contains_class.yaml`; the helper runs
# with `--invert`.
api_version: 4
name: Does not contain class
description: Keep only images whose label does not contain the chosen class.
arguments:
  - name: class_name
    required: true
    options: {DATASET_CLASS_NAMES}
steps:
  - {PYTHON} {APP_SCRIPT_DIR}/class_filter.py {DATA_YAML_PATH} {SPLIT} {INPUT_PIPE} {OUTPUT_PIPE} --class {CLASS_NAME} --invert

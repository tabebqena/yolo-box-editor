<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="YOLO Box Editor UI mockup">
  <defs>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset="1" stop-color="#1a2233"/>
    </linearGradient>
    <style>
      .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #c9ccd6; }
      .muted { fill: #8a8f9e; }
      .tiny { font-size: 11px; }
      .small { font-size: 12px; }
      .head { font-size: 13px; font-weight: 600; }
      .badge { font-size: 11px; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="520" rx="12" fill="#12131a" stroke="#2a2c36"/>

  <!-- title bar -->
  <circle cx="24" cy="22" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="22" r="5" fill="#febc2e"/>
  <circle cx="60" cy="22" r="5" fill="#28c840"/>
  <text x="450" y="27" text-anchor="middle" class="t head">YOLO Box Editor</text>

  <!-- canvas -->
  <rect x="16" y="44" width="600" height="380" rx="8" fill="#0b0c10" stroke="#24262f"/>
  <rect x="70" y="80" width="480" height="300" rx="6" fill="url(#photo)"/>
  <text x="310" y="235" text-anchor="middle" class="t muted" font-size="14">image.jpg</text>

  <!-- boxes -->
  <rect x="130" y="120" width="170" height="120" rx="3" fill="none" stroke="#ff9d3c" stroke-width="2"/>
  <rect x="128" y="108" width="70" height="16" rx="3" fill="#ff9d3c"/>
  <text x="163" y="120" text-anchor="middle" fill="#1a1205" class="badge" font-weight="600">person</text>
  <rect x="340" y="230" width="150" height="110" rx="3" fill="none" stroke="#3ddc84" stroke-width="2"/>
  <rect x="338" y="218" width="54" height="16" rx="3" fill="#3ddc84"/>
  <text x="365" y="230" text-anchor="middle" fill="#0c1a10" class="badge" font-weight="600">car</text>

  <!-- sidebar -->
  <rect x="628" y="44" width="256" height="380" rx="8" fill="#1a1b22" stroke="#24262f"/>
  <text x="646" y="70" class="t head">Dataset</text>
  <text x="646" y="88" class="t muted small">my-dataset</text>
  <line x1="644" y1="102" x2="868" y2="102" stroke="#2a2c36"/>
  <text x="646" y="126" class="t head">Split</text>
  <rect x="644" y="136" width="200" height="24" rx="4" fill="#12131a" stroke="#2f313c"/>
  <text x="654" y="152" class="t small">All splits</text>
  <line x1="644" y1="176" x2="868" y2="176" stroke="#2a2c36"/>
  <text x="646" y="200" class="t head">Actions</text>
  <g>
    <rect x="644" y="210" width="94" height="26" rx="5" fill="#22242e" stroke="#333642"/>
    <text x="691" y="227" text-anchor="middle" class="t small">Remove</text>
    <rect x="746" y="210" width="98" height="26" rx="5" fill="#22242e" stroke="#333642"/>
    <text x="795" y="227" text-anchor="middle" class="t small">Archive</text>
  </g>
  <line x1="644" y1="252" x2="868" y2="252" stroke="#2a2c36"/>
  <text x="646" y="276" class="t head">Boxes</text>
  <g class="t small">
    <text x="646" y="300" class="muted">0</text>
    <text x="666" y="300">person</text>
    <text x="760" y="300" class="muted">0.42 0.38 0.28 0.40</text>
    <text x="646" y="326" class="muted">1</text>
    <text x="666" y="326">car</text>
    <text x="760" y="326" class="muted">0.69 0.76 0.25 0.36</text>
  </g>

  <!-- bottom bar -->
  <rect x="16" y="436" width="868" height="68" rx="8" fill="#1a1b22" stroke="#24262f"/>
  <text x="34" y="462" class="t muted tiny" font-weight="600" letter-spacing="1">TAGS</text>
  <g>
    <rect x="80" y="450" width="54" height="22" rx="11" fill="#3ddc84"/>
    <text x="107" y="465" text-anchor="middle" fill="#0c1a10" class="badge" font-weight="600">fire</text>
    <rect x="142" y="450" width="66" height="22" rx="11" fill="#3ddc84"/>
    <text x="175" y="465" text-anchor="middle" fill="#0c1a10" class="badge" font-weight="600">smoke</text>
    <rect x="216" y="450" width="62" height="22" rx="11" fill="none" stroke="#3a3d49"/>
    <text x="247" y="465" text-anchor="middle" class="t badge">danger</text>
    <rect x="286" y="450" width="52" height="22" rx="11" fill="none" stroke="#3a3d49"/>
    <text x="312" y="465" text-anchor="middle" class="t badge">night</text>
  </g>
  <g>
    <rect x="640" y="450" width="60" height="26" rx="5" fill="#22242e" stroke="#333642"/>
    <text x="670" y="467" text-anchor="middle" class="t small">◀ Prev</text>
    <rect x="708" y="450" width="58" height="26" rx="5" fill="#12131a" stroke="#2f313c"/>
    <text x="737" y="467" text-anchor="middle" class="t small">3 / 128</text>
    <rect x="774" y="450" width="60" height="26" rx="5" fill="#22242e" stroke="#333642"/>
    <text x="804" y="467" text-anchor="middle" class="t small">Next ▶</text>
    <rect x="842" y="450" width="34" height="26" rx="5" fill="#3ddc84"/>
    <text x="859" y="467" text-anchor="middle" fill="#0c1a10" class="small" font-weight="600">Save</text>
  </g>
</svg>

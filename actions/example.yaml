# yolo-box-editor user actions: one YAML file per action, in this actions/ dir.
#
# This example file is comments only and defines nothing. Copy it (or any file
# here) to a new <Name>.yaml to add an action, or write your own with a `name:`
# key. A file with no `steps` and no `after_success` is ignored.
#
# Format (2-space indentation, lines starting with # are ignored):
#
#   name: Remove                # optional; defaults to the file name
#   steps:                      # shell commands, run in order; execution
#     - rm -f {IMAGE_PATH}      # stops at the first failure
#     - rm -f {LABEL_PATH}
#   after_success:              # optional, run client-side after all steps
#     - app_refresh_images_list # succeeded (stop at first error). Entries may
#                               # be app actions (app_*) or other actions.
#
# `steps` and `after_success` may also be a single value on the key line.
#
# Event hooks: an action whose name starts with `on_app_hook_` is a hook. It is
# not a toolbar button and cannot be bound to a key; the app runs it when the
# matching event happens. Available hooks:
#
#   on_app_hook_images_list_loaded   image list loaded / rescanned
#   on_app_hook_image_loaded         an image opened in the editor
#   on_app_hook_prev                 before navigating to the previous image
#   on_app_hook_next                 before navigating to the next image
#   on_app_hook_before_save          before labels are written (failure aborts)
#   on_app_hook_after_save           after a successful label write
#   on_app_hook_box_created          a box was drawn
#   on_app_hook_box_deleted          a box was removed
#   on_app_hook_box_edited           a box was moved/resized/reclassed
#
# Example: actions/on_app_hook_after_save.yaml
#   steps:
#     - touch {DATASET_PATH}/saved.log
#
# Hooks may not be named in `after_success` (they are event-driven only).
#
# Placeholders (do NOT quote them; the app shell-quotes each value for you):
#   {IMAGE_PATH}     path of the current image
#   {LABEL_PATH}     path of the current image's label file (may not exist yet)
#   {DATASET_PATH}   root path of the loaded dataset
#   {DATA_YAML_PATH} path of the loaded data.yaml
#   {IMAGE_INDEX}    1-based position of the current image in the list
#
# App actions usable in after_success (see README for the full list):
#   app_refresh_images_list   re-scan the image folders (stay on same index)
#   app_refresh_image         re-fetch the current image (cache-busted)
#
# Personal actions: files ending in `.a.yaml` are read after the others, win on
# a name clash, and are never shipped/overwritten (they are git-ignored).
